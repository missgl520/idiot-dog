name: zhuyapp
description: "竹芽 - 2D虚拟角色语音陪聊助手"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^14.8.1

  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # SQLite + FTS5（长期记忆搜索）
  sqflite: ^2.4.2
  path: ^1.9.1

  # HTTP
  http: ^1.3.0

  # TTS（小米离线引擎，flutter_tts调用系统TTS）
  flutter_tts: ^4.2.0

  # ASR语音识别
  speech_to_text: ^7.0.0

  # Live2D虚拟角色（后期单独安装）
  # flutter_live2d: ^1.0.2

  # 权限
  permission_handler: ^12.0.3
  flutter_permission_wizard: ^0.1.4

  # 工具
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/live2d/
    - assets/audio/
