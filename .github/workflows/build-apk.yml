# GitHub Actions 工作流：构建竹芽 Android APK
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 缓存 Gradle（避免每次重下载）
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-cache-${{ runner.os }}

      # 设置国内镜像
      - name: Configure China mirrors
        run: |
          echo "FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn/flutter_infra_release" >> $GITHUB_ENV
          echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" >> $GITHUB_ENV

      # Gradle 网络超时改为 5 分钟（国内网络慢）
      - name: Increase Gradle timeout
        run: |
          sed -i 's/networkTimeout=120000/networkTimeout=300000/' android/gradle/wrapper/gradle-wrapper.properties

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      # 修复 flutter_live2d 硬编码的 CMake 3.10.2 版本
      # 兼容 pub.dev 和 pub.flutter-io.cn 两种镜像路径
      - name: Patch flutter_live2d CMake version
        run: |
          set -e
          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          GRADLE_FILE=$(find "$PUB_CACHE" -path "*flutter_live2d-1.0.2/android/build.gradle.kts" 2>/dev/null | head -1)
          echo "Found gradle file: $GRADLE_FILE"
          if [ -n "$GRADLE_FILE" ] && grep -q 'version = "3\.10\.2"' "$GRADLE_FILE"; then
            sed -i 's/version = "3\.10\.2"/version = "3.22.1"/' "$GRADLE_FILE"
            echo "✅ CMake version patched"
          else
            echo "⚠️  Not found or already patched, skipping"
          fi

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhuyapp-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
