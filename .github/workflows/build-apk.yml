# GitHub Actions 工作流：构建竹芽 Android APK
name: Build APK

# 触发条件：main 分支推送 或 手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # 在最新的 Ubuntu 运行器上执行
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      # 3. 安装 JDK 17（Android 构建需要）
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. 缓存 Flutter 依赖（pub-cache），加速后续构建
      - name: Cache Flutter
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      # 5. 拉取 Flutter 项目依赖
      - name: Get dependencies
        run: flutter pub get

      # 5.5 修复 flutter_live2d 插件硬编码的 CMake 3.10.2 版本
      # GitHub Actions 运行器预装 CMake 3.22.1，但插件要求 3.10.2 精确匹配
      - name: Patch flutter_live2d CMake version
        run: |
          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          sed -i 's/version = "3\.10\.2"/version = "3\.22\.1"/' \
            "$PUB_CACHE/hosted/pub.dev/flutter_live2d-1.0.2/android/build.gradle.kts"

      # 6. 构建 Debug APK
      - name: Build debug APK
        run: flutter build apk --debug

      # 7. 上传构建产物为 GitHub Actions Artifact，保留 7 天
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhuyapp-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      # 8. 手动触发时，创建 GitHub Release 并上传 APK
      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-test
          files: build/app/outputs/flutter-apk/app-debug.apk
          name: 竹芽 Debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
