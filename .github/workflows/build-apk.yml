# GitHub Actions 工作流：构建竹芽 Android APK
name: Build APK

# 触发条件：main 分支推送 或 手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      # 3. 安装 JDK 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. 禁用缓存（避免旧插件残留导致构建失败）
      - name: Cache Flutter
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: never-${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: never-

      # 5. 设置国内镜像（GitHub Actions 在美国服务器，直连 pub.dev 慢）
      - name: Configure China mirrors
        run: |
          # Flutter 工具链镜像
          echo "FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn/flutter_infra_release" >> $GITHUB_ENV
          # pub 包镜像
          echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" >> $GITHUB_ENV

      # 6. 清理并拉取 Flutter 项目依赖
      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      # 7. 修复 flutter_live2d 插件硬编码的 CMake 3.10.2 版本
      # GitHub Actions 运行器预装 CMake 3.22.1，插件要求精确匹配
      - name: Patch flutter_live2d CMake version
        run: |
          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          sed -i 's/version = "3\.10\.2"/version = "3.22.1"/' \
            "$PUB_CACHE/hosted/pub.dev/flutter_live2d-1.0.2/android/build.gradle.kts"

      # 8. 构建 Debug APK
      - name: Build debug APK
        run: flutter build apk --debug

      # 9. 上传构建产物（保留 7 天）
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhuyapp-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      # 10. 手动触发时创建 Release
      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-test
          files: build/app/outputs/flutter-apk/app-debug.apk
          name: 竹芽 Debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
