# ============================================================
# zhuyu CNB Pipeline
# Trigger: main branch push + api_trigger
# Output: Flutter Android Debug APK
# ============================================================

main:
  push:
  api_trigger:

    # ── ARM64 ──────────────────────────────────────────────
    - name: flutter-apk-arm64
      runner:
        tags: cnb:arch:default
        cpus: 4
      docker:
        build:
          dockerfile: .cnb/Dockerfile
          by:
            - pubspec.lock
          versionBy:
            - pubspec.lock
        volumes:
          - pub-cache:/root/.pub-cache:copy-on-write
      stages:
        - name: check-env
          jobs:
            - name: flutter-version
              script: |
                flutter --version
                flutter doctor | head -10
            - name: android-licenses
              script: |
                yes | flutter doctor --android-licenses > /dev/null 2>&1 || true
        - name: deps
          jobs:
            - name: pub-get
              script: |
                flutter config --machine
                flutter pub get
        - name: analyze
          jobs:
            - name: static-check
              script: |
                flutter analyze lib/ --no-fatal-infos --no-fatal-warnings || true
        - name: build
          jobs:
            - name: assemble-debug
              script: |
                flutter build apk --debug --target-platform=android-arm64 --no-pub
                echo "=== APK ==="
                ls -lh build/app/outputs/flutter-apk/
        - name: artifact
          jobs:
            - name: record
              script: |
                echo "CNB_COMMIT=${CNB_COMMIT_SHA:-unknown}"
                APK=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
                echo "APK_FILE=${APK}"
                echo "APK_SIZE=$(du -h ${APK} 2>/dev/null | cut -f1)"

    # ── AMD64 ──────────────────────────────────────────────
    - name: flutter-apk-amd64
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      docker:
        build:
          dockerfile: .cnb/Dockerfile
          by:
            - pubspec.lock
          versionBy:
            - pubspec.lock
        volumes:
          - pub-cache:/root/.pub-cache:copy-on-write
      stages:
        - name: check-env
          jobs:
            - name: flutter-version
              script: |
                flutter --version
                flutter doctor | head -10
            - name: android-licenses
              script: |
                yes | flutter doctor --android-licenses > /dev/null 2>&1 || true
        - name: deps
          jobs:
            - name: pub-get
              script: |
                flutter config --machine
                flutter pub get
        - name: analyze
          jobs:
            - name: static-check
              script: |
                flutter analyze lib/ --no-fatal-infos --no-fatal-warnings || true
        - name: build
          jobs:
            - name: assemble-debug
              script: |
                flutter build apk --debug --target-platform=android-x64 --no-pub
                echo "=== APK ==="
                ls -lh build/app/outputs/flutter-apk/
        - name: artifact
          jobs:
            - name: record
              script: |
                echo "CNB_COMMIT=${CNB_COMMIT_SHA:-unknown}"
                APK=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
                echo "APK_FILE=${APK}"
                echo "APK_SIZE=$(du -h ${APK} 2>/dev/null | cut -f1)"
